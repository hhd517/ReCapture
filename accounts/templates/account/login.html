{% extends "base.html" %}
{% load i18n %}
{% load account socialaccount %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h2>로그인</h2>
        <p class="login-subtitle">Re:Capture에 오신 것을 환영합니다!</p>

        <div class="social-login">
            <a href="{% provider_login_url 'google' process='login' %}" class="btn-google-login">
                <i class="fa-brands fa-google"></i> Google로 시작하기
            </a>
        </div>

        <div class="login-footer">
            <p>로그인 시 서비스 이용약관에 동의하게 됩니다.</p>
        </div>
    </div>
</div>

<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px); /* 헤더 제외 중앙 배치 */
    }

    .login-box {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        text-align: center;
        width: 100%;
        max-width: 400px;
    }

    .login-box h2 {
        font-weight: 800;
        color: #333;
        margin-bottom: 10px;
    }

    .login-subtitle {
        color: #888;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .btn-google-login {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background-color: #ffffff;
        color: #444;
        border: 1px solid #ddd;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        transition: all 0.2s;
        text-decoration: none;
    }

    .btn-google-login:hover {
        background-color: #f8f9fa;
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .btn-google-login i {
        color: #4285f4;
        font-size: 18px;
    }

    .login-footer {
        margin-top: 30px;
        font-size: 12px;
        color: #bbb;
    }
</style>
{% endblock %}
