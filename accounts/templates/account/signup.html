{% extends "base.html" %}
{% load i18n %}
{% load account socialaccount %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h2>회원가입</h2>

        <div class="social-login">
            <a href="{% provider_login_url 'google' process='connect' %}" class="btn-google-login">
                <i class="fa-brands fa-google"></i> Google로 간편 가입하기
            </a>
        </div>

        <div class="login-divider">
            <span>또는</span>
        </div>

        <form class="signup-form" method="post" action="{% url 'account_signup' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary-login">가입하기</button>
        </form>

        <div class="login-footer">
            <p>이미 계정이 있으신가요? <a href="{% url 'account_login' %}" style="color: #007bff; font-weight: 600;">로그인하기</a></p>
        </div>
    </div>
</div>

<style>
    /* 로그인 페이지와 동일한 베이스 스타일 */
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
    }

    .login-box {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        text-align: center;
        width: 100%;
        max-width: 450px;
    }

    .login-divider {
        margin: 25px 0;
        position: relative;
        border-bottom: 1px solid #eee;
    }

    .login-divider span {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        padding: 0 15px;
        color: #bbb;
        font-size: 13px;
    }

    .btn-google-login {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background-color: #ffffff;
        color: #444;
        border: 1px solid #ddd;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        transition: all 0.2s;
        text-decoration: none;
    }

    .btn-primary-login {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
    }

    /* 장고 기본 폼 스타일링 */
    .signup-form p {
        text-align: left;
        margin-bottom: 15px;
    }

    .signup-form input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-top: 5px;
    }
</style>
{% endblock %}
