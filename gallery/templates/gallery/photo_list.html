<script>
const CSRF_TOKEN = "{{ csrf_token }}";
const API_BASE = "/api/v1/photos";
let importJobId = null;
let importSessionId = null;

let sessionPollingInterval = null;
let importPollingInterval = null;

document.addEventListener("DOMContentLoaded", function() {
  const toggle = document.getElementById("sidebarToggle");
  const sidebar = document.getElementById("filterSidebar");
  const overlay = document.getElementById("sidebarOverlay");
  const close = document.getElementById("sidebarClose");

  if (toggle) {
    toggle.addEventListener("click", () => {
      sidebar.classList.add("open");
      overlay.classList.add("show");
    });
  }

  if (close) {
    close.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
    });
  }

  if (overlay) {
    overlay.addEventListener("click", () => {
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
    });
  }
});

function showProgress(text) {
  document.getElementById("importProgress").style.display = "block";
  document.getElementById("importStatus").textContent = text;
}

function stopIntervals() {
  if (sessionPollingInterval) clearInterval(sessionPollingInterval);
  if (importPollingInterval) clearInterval(importPollingInterval);
  sessionPollingInterval = null;
  importPollingInterval = null;
}

// ✅ 구글 Picker import (세션 생성 → picker 열기 → 선택 감지 → confirm → celery 진행 폴링)
async function importGooglePhotos() {
  stopIntervals();

  try {
    // 1) 연동 상태 확인
    const statusData = await fetchJsonSafe(`${API_BASE}/google/status`, {
      method: "GET",
      headers: { "Content-Type": "application/json" }
    });

    if (!statusData.data || !statusData.data.connected) {
      if (confirm("구글 포토 연동이 필요합니다. 연동하시겠습니까?")) {
        const authData = await fetchJsonSafe(`${API_BASE}/google/authorize`, {
          method: "GET",
          headers: { "Content-Type": "application/json" }
        });

        if (authData.data && authData.data.authUrl) {
          window.location.href = authData.data.authUrl;
          return;
        }
        alert("인증 URL 생성에 실패했습니다.");
      }
      return;
    }

    showProgress("Picker 여는 중...");

    // 2) picker session 생성(backend)
    const importData = await fetchJsonSafe(`${API_BASE}/import/google`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dedupe: true })
    });

    if (!importData.data || !importData.data.jobId || !importData.data.pickerUri || !importData.data.sessionId) {
      throw new Error(importData.message || "Picker 세션 생성 실패");
    }

    importJobId = importData.data.jobId;
    importSessionId = importData.data.sessionId;

    // 3) picker 새 탭 열기
    window.open(importData.data.pickerUri, "_blank");

    showProgress("🖱️ 구글 포토에서 사진을 선택하고 창을 닫아. 선택 완료 확인 중...");
    startSessionPolling();

  } catch (error) {
    console.error("Import error:", error);
    alert("구글 포토 불러오기 실패: " + error.message);
    stopIntervals();
  }
}

function startSessionPolling() {
  if (sessionPollingInterval) clearInterval(sessionPollingInterval);

  sessionPollingInterval = setInterval(async () => {
    try {
      const data = await fetchJsonSafe(`${API_BASE}/import/google/session/${importSessionId}`, {
        method: "GET",
        headers: { "Content-Type": "application/json" }
      });

      if (!data.data || !data.data.session) return;

      const session = data.data.session;

      // 선택 완료되면 backend confirm 호출
      if (session.mediaItemsSet === true) {
        clearInterval(sessionPollingInterval);
        sessionPollingInterval = null;

        showProgress("✅ 선택 완료! 다운로드 시작하는 중...");
        await confirmSelectionAndStartImport();
      }
    } catch (error) {
      console.error("Session polling error:", error);
    }
  }, 2000);
}

async function confirmSelectionAndStartImport() {
  const data = await fetchJsonSafe(`${API_BASE}/import/google/confirm`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      jobId: importJobId,
      sessionId: importSessionId,
      dedupe: true
    })
  });

  if (!data.success) {
    throw new Error(data.message || "Import confirm 실패");
  }

  showProgress("⬇️ 선택한 사진 다운로드 중...");
  startImportPolling();
}

function startImportPolling() {
  if (importPollingInterval) clearInterval(importPollingInterval);

  importPollingInterval = setInterval(async () => {
    try {
      const data = await fetchJsonSafe(`${API_BASE}/import/jobs/${importJobId}`, {
        method: "GET",
        headers: { "Content-Type": "application/json" }
      });

      if (!data.data) return;

      const { status, progress } = data.data;
      const { total, done, skipped, failed } = progress;

      const percentage = total > 0 ? Math.round(((done + skipped + failed) / total) * 100) : 0;
      document.getElementById("progressBar").style.width = percentage + "%";
      document.getElementById("progressText").textContent = `${done} / ${total} (건너뜀: ${skipped}, 실패: ${failed})`;

      if (status === "DONE") {
        document.getElementById("importStatus").textContent = "✅ 사진 가져오기 완료!";
        clearInterval(importPollingInterval);
        importPollingInterval = null;
        setTimeout(() => location.reload(), 1500);
      } else if (status === "FAILED") {
        document.getElementById("importStatus").textContent = "❌ 사진 가져오기 실패";
        clearInterval(importPollingInterval);
        importPollingInterval = null;
      } else if (status === "PICKING") {
        document.getElementById("importStatus").textContent = "🖱️ 사진 선택 중...";
      } else {
        document.getElementById("importStatus").textContent = "⬇️ 다운로드 진행 중...";
      }

    } catch (error) {
      console.error("Import polling error:", error);
    }
  }, 2000);
}

// ✅ 직접 업로드
async function uploadPhotos(event) {
  const files = event.target.files;
  if (!files || files.length === 0) return;

  const formData = new FormData();
  for (let file of files) formData.append("files", file);

  try {
    const data = await fetchJsonSafe(`${API_BASE}/upload`, {
      method: "POST",
      body: formData
    });

    if (data.success) {
      alert(`${data.data.created.length}개 사진 업로드 완료!`);
      location.reload();
    } else {
      alert("업로드 실패: " + (data.message || "알 수 없는 오류"));
    }
  } catch (error) {
    console.error("Upload error:", error);
    alert("업로드 실패: " + error.message);
  } finally {
    // 같은 파일을 다시 선택해도 change 이벤트가 뜨도록 value reset
    try { event.target.value = ""; } catch (e) {}
  }
}

// ✅ 분류(미분류 사진)
async function classifyPhotos() {
  if (!confirm("미분류(분류 전) 사진을 분류할까요?")) return;

  try {
    const data = await fetchJsonSafe(`${API_BASE}/classify`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": CSRF_TOKEN
      },
      credentials: "same-origin",
      body: JSON.stringify({ limit: 1000 })
    });

    if (data.success) {
      alert("분류 요청이 완료되었습니다.");
      location.reload();
    } else {
      alert("분류 실패: " + (data.message || "알 수 없는 오류"));
    }
  } catch (error) {
    console.error("Classify error:", error);
    alert("분류 실패: " + error.message);
  }
}
</script>
