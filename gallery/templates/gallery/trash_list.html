{% extends 'base.html' %}

{% block content %}
<h2>🗑️ 휴지통</h2>
<p>휴지통에 있는 사진은 30일 뒤에 영구 삭제됩니다.</p>
<a href="{% url 'gallery:photo_list' %}">← 갤러리로 돌아가기</a>

<div class="trash-grid" style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px;">
    {% for photo in photos %}
        <div class="photo-card" style="border: 1px solid #ddd; padding: 10px; opacity: 0.7;">
            <img src="{{ photo.image.url }}" style="width: 150px; height: 150px; object-fit: cover; filter: grayscale(100%);">
            <div style="margin-top: 10px;">
                <button onclick="restorePhoto({{ photo.id }})" style="color: blue;">복구</button>
                <button onclick="permanentDelete({{ photo.id }})" style="color: red;">영구 삭제</button>
            </div>
        </div>
    {% empty %}
        <p>휴지통이 비어 있습니다.</p>
    {% endfor %}
</div>

<script>
function restorePhoto(photoId) {
    if (!confirm('사진을 복구하시겠습니까?')) return;
    fetch(`/gallery/trash/${photoId}/restore/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': '{{ csrf_token }}' }
    })
    .then(res => res.json())
    .then(data => { if(data.success) location.reload(); });
}

function permanentDelete(photoId) {
    if (!confirm('영구 삭제하면 되돌릴 수 없습니다. 삭제하시겠습니까?')) return;
    fetch(`/gallery/trash/${photoId}/`, {
        method: 'DELETE',
        headers: { 'X-CSRFToken': '{{ csrf_token }}' }
    })
    .then(res => res.json())
    .then(data => { if(data.success) location.reload(); });
}
</script>
{% endblock %}
