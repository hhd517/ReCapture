{% for photo in photos %}
    <div class="trash-item">
        <img src="{{ photo.image.url }}" style="filter: grayscale(80%); width: 100px;">
        <p>삭제일: {{ photo.trashed_at|date:"Y-m-d" }}</p>
        <p style="color: red;">영구 삭제 예정: {{ photo.expires_at|date:"Y-m-d" }}</p>
        
        <form action="{% url 'gallery:restore_photo' photo.pk %}" method="POST">
            {% csrf_token %}
            <button type="submit">복구</button>
        </form>
    </div>
{% endfor %}
